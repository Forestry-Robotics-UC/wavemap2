name: ROS2 Interface

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: wavemap2-ci
  CACHE_SCOPE: ros2-ci-image
  COLCON_WS_PATH: /home/ci/ros2_ws

# NOTE: The CI image is not published to a container registry. The 'image' job
#       builds it and fills GitHub's Actions cache, and every other job
#       rebuilds it from that cache (a few seconds when nothing changed) and
#       runs its commands inside it. This avoids needing any package
#       permissions or registry access.

jobs:
  image:
    name: Build ROS2 container
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the package's repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tooling/docker/ros2/full.Dockerfile
          target: workspace
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          tags: ${{ env.IMAGE_NAME }}

      - name: Test the image
        run: docker run --rm ${{ env.IMAGE_NAME }}

  build:
    name: Build
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the package's repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tooling/docker/ros2/full.Dockerfile
          target: workspace
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          tags: ${{ env.IMAGE_NAME }}

      - name: Build all wavemap packages
        run: |
          echo "::add-matcher::./.github/problem-matchers/gcc.json"
          docker run --rm ${{ env.IMAGE_NAME }} bash -c '
            . /opt/ros/jazzy/setup.sh &&
            colcon build --packages-up-to wavemap2_all \
              --event-handlers console_cohesion+ \
              --cmake-args -DCMAKE_BUILD_TYPE=Release'
          echo "::remove-matcher owner=problem-matcher-gcc::"

  install:
    name: Install
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the package's repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tooling/docker/ros2/full.Dockerfile
          target: workspace
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          tags: ${{ env.IMAGE_NAME }}

      # NOTE: colcon always builds into an install space, so the counterpart
      #       of catkin's install mode is a merged install, where all packages
      #       share one prefix and overlapping install rules would collide.
      - name: Build all wavemap packages into a merged install space
        run: |
          echo "::add-matcher::./.github/problem-matchers/gcc.json"
          docker run --rm ${{ env.IMAGE_NAME }} bash -c '
            . /opt/ros/jazzy/setup.sh &&
            rm -rf build install log &&
            colcon build --packages-up-to wavemap2_all --merge-install \
              --event-handlers console_cohesion+ \
              --cmake-args -DCMAKE_BUILD_TYPE=Release'
          echo "::remove-matcher owner=problem-matcher-gcc::"

  test:
    name: Test (${{ matrix.map_msgs_layout }} map msgs)
    needs: image
    runs-on: ubuntu-24.04
    # NOTE: wavemap2_msgs can be built with either octree node layout (see
    #       WAVEMAP2_MSGS_LAYOUT in its CMakeLists.txt), and the code that
    #       uses it compiles differently for each. The other jobs only cover
    #       the default 'flat' layout.
    strategy:
      matrix:
        map_msgs_layout: [ flat, nested ]
      fail-fast: false
    steps:
      - name: Fetch the package's repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tooling/docker/ros2/full.Dockerfile
          target: workspace
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          tags: ${{ env.IMAGE_NAME }}

      - name: Build code, build unit tests and run them
        run: |
          echo "::add-matcher::./.github/problem-matchers/gcc.json"
          docker run --rm ${{ env.IMAGE_NAME }} bash -c '
            . /opt/ros/jazzy/setup.sh &&
            colcon build --packages-up-to wavemap2_all \
              --event-handlers console_cohesion+ \
              --cmake-args -DCMAKE_BUILD_TYPE=Release -DDCHECK_ALWAYS_ON=ON \
              -DBUILD_TESTING=ON \
              -DWAVEMAP2_MSGS_LAYOUT=${{ matrix.map_msgs_layout }} &&
            colcon test --packages-up-to wavemap2_all \
              --event-handlers console_cohesion+ \
              --ctest-args --output-on-failure &&
            colcon test-result --verbose'
          echo "::remove-matcher owner=problem-matcher-gcc::"
